<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contract collaboration loop</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="stage">
  <div id="camera">

    <div id="startScreen">
      <button id="makeBtn">
        <span class="icon">＋</span> Make contract
      </button>
    </div>

    <div id="doc">
      <div id="docTitle"></div>
      <div class="divider"></div>

      <div id="clause1" class="clause"></div>
      <div id="clause2" class="clause"></div>

      <div id="suggestionBox">
        <span id="suggestionText"></span>
      </div>

      <div id="clause3" class="clause"></div>
      <div class="divider" style="margin-top:20px;"></div>

      <div id="sigBlock">
        <div class="sigRow">
          <div class="sigLabel">Signed by You</div>
          <div id="sig1" class="sigLine"></div>
        </div>
        <div class="sigRow">
          <div class="sigLabel">Signed by Alex</div>
          <div id="sig2" class="sigLine"></div>
        </div>
      </div>

      <div id="printRow">
        <button id="printBtn">
            Print contract
        </button>
      </div>

      <div id="lockBadge">
        <span>Contract locked</span>
      </div>
    </div>

    <div id="cursorYou" class="cursor">
      <span class="pointerIcon">➤</span>
    </div>
    <div id="cursorAlex" class="cursor">
      <span class="pointerIcon">➤</span>
    </div>

  </div>
</div>

<script src="animation.js"></script>
</body>
</html>
