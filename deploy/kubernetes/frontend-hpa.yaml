apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pactum-frontend
  namespace: pactum
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: pactum-frontend}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
