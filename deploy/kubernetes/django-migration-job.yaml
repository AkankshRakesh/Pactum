apiVersion: batch/v1
kind: Job
metadata:
  name: pactum-migrate
  namespace: pactum
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: pactum-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: BACKEND_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          command:
            - python
            - manage.py
            - migrate
          envFrom:
            - secretRef:
                name: pactum-app-secrets
          env:
            - name: DB_HOST
              value: "aws-0-ap-south-1.pooler.supabase.com"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "postgres"
            - name: DB_USER
              value: "postgres.fpaupamwhoqwtmqnjjnn"