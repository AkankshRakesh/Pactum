{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Pactum{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/home.css' %}">
<link rel="stylesheet" href="{% static 'core/css/sign.css' %}">
{% block extra_head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="{% static 'core/js/home.js' %}" defer></script>
<script src="{% static 'core/js/contract_animation.js' %}"></script>
<script>
  document.fonts.load('700 34px "Dancing Script"').then(() => {
    const el = document.getElementById('signed-text');
    if (!el) return;
    el.classList.add('draw');
    el.getBoundingClientRect();
  });
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
