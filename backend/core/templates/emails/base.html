<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Pactum{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#f3eee8;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#f3eee8;">
    {% block preheader %}{% endblock %}
  </div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#f3eee8">
    <tr><td align="center" style="padding:32px 12px;">
      <table role="presentation" width="600" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;">
        <tr><td style="padding:0 4px 18px;">
          <table role="presentation" cellspacing="0" cellpadding="0" border="0">
            <tr><td style="padding-left:10px;font-family:Georgia,'Times New Roman',serif;font-size:20px;font-weight:bold;color:#1a0f10;">Pactum</td></tr>
          </table>
        </td></tr>
        <tr><td style="background:#fffdfb;border-radius:14px;overflow:hidden;box-shadow:0 4px 24px rgba(26,15,16,.08);">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr><td style="height:6px;background:#8b2635;font-size:0;line-height:0;">&nbsp;</td></tr>
            <tr><td style="padding:36px 36px 34px;font-family:Arial,Helvetica,sans-serif;color:#1a0f10;">
              <p style="margin:0 0 10px;font-size:11px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase;color:#8b2635;">{% block badge %}{% endblock %}</p>
              <h1 style="margin:0 0 18px;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.25;color:#1a0f10;">{% block heading %}{% endblock %}</h1>
              {% block content %}{% endblock %}
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:22px 12px 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:1.6;color:#6b5d5e;">
          Sent securely by Pactum &middot; Contracts that stay as signed.<br>
          If you weren&rsquo;t expecting this email you can safely ignore it.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
