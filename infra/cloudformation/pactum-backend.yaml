
AWSTemplateFormatVersion: "2010-09-09"
Description: Pactum Django backend on EC2 with k3s and ALB, using Supabase PostgreSQL.

Parameters:
  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  InstanceType:
    Type: String
    Default: c7i-flex.large

  MonitoringInstanceType:
    Type: String
    Description: EC2 instance type for Prometheus and Grafana
    Default: c7i-flex.large

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to Pactum API
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  BackendSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend EC2 accepts NodePort traffic from ALB only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 30080
          ToPort: 30080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - IpProtocol: tcp
          FromPort: 9100
          ToPort: 9100
          SourceSecurityGroupId: !Ref MonitoringSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      SecurityGroups:
        - !Ref AlbSecurityGroup

  BackendTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 30080
      TargetType: instance
      Targets:
        - Id: !Ref BackendInstance
          Port: 30080
        - Id: !Ref BackendInstance2
          Port: 30080
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/
      Matcher:
        HttpCode: "200"
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      HealthCheckIntervalSeconds: 20

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BackendTargetGroup

  BackendInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadPactumApplicationSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pactum/supabase-db-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pactum/django-secret-key-*"

  BackendInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref BackendInstanceRole

  BackendInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - AttachInternetGateway
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BackendInstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      KeyName: kin
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-backend"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          exec > >(tee -a /var/log/pactum-bootstrap.log) 2>&1

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y curl ca-certificates git

          # Install k3s
          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644" sh -

          systemctl enable --now k3s

          # Verify Kubernetes is ready
          for i in $(seq 1 60); do
            if /usr/local/bin/k3s kubectl get nodes >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          /usr/local/bin/k3s kubectl get nodes

  BackendInstance2:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - AttachInternetGateway
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref BackendInstanceProfile
      SubnetId: !Ref PublicSubnetB
      SecurityGroupIds:
        - !Ref BackendSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      KeyName: kin
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-backend-2"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          exec > >(tee -a /var/log/pactum-bootstrap.log) 2>&1

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y curl ca-certificates git

          curl -sfL https://get.k3s.io | \
            INSTALL_K3S_EXEC="server --write-kubeconfig-mode 644" sh -

          systemctl enable --now k3s

          for i in $(seq 1 60); do
            if /usr/local/bin/k3s kubectl get nodes >/dev/null 2>&1; then
              break
            fi
            sleep 5
          done

          /usr/local/bin/k3s kubectl get nodes


  MonitoringInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - PublicRoute
      - AttachInternetGateway
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref MonitoringInstanceType
      IamInstanceProfile: !Ref MonitoringInstanceProfile
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref MonitoringSecurityGroup
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-monitoring"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail

          exec > >(tee -a /var/log/pactum-monitoring-bootstrap.log) 2>&1
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y docker.io jq ca-certificates curl unzip
          systemctl enable --now docker

          # Ubuntu 24.04 does not have an awscli apt candidate in this environment.
          if ! command -v /usr/local/bin/aws >/dev/null 2>&1; then
              curl -fsSL \
                "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
                -o /tmp/awscliv2.zip

              rm -rf /tmp/aws
              unzip -q /tmp/awscliv2.zip -d /tmp
              /tmp/aws/install --update

              rm -rf /tmp/aws /tmp/awscliv2.zip
          fi

          /usr/local/bin/aws --version
          docker --version

          echo "MONITORING_PREREQUISITES_READY"

  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private access for Pactum Prometheus and Grafana monitoring
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-monitoring-sg"

  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/grafana-admin"
      Description: Administrator credentials for Pactum Grafana
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  MonitoringInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadGrafanaAdminSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref GrafanaAdminSecret
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:pactum-backend/grafana-admin-*'

  MonitoringInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref MonitoringInstanceRole

Outputs:
  InstanceIds:
    Description: Comma-separated backend EC2 instance IDs
    Value: !Join
      - ","
      - - !Ref BackendInstance
        - !Ref BackendInstance2

  LoadBalancerDNS:
    Description: ALB DNS name for the backend API
    Value: !GetAtt Alb.DNSName

  BackendApiUrl:
    Description: Temporary HTTP API URL; configure HTTPS before production use
    Value: !Sub "http://${Alb.DNSName}"

  InstancePrivateIps:
    Description: Comma-separated backend private IP addresses
    Value: !Join
      - ","
      - - !GetAtt BackendInstance.PrivateIp
        - !GetAtt BackendInstance2.PrivateIp
  
  MonitoringInstanceId:
    Description: EC2 instance running Prometheus and Grafana
    Value: !Ref MonitoringInstance

  GrafanaAdminSecretArn:
    Description: Secrets Manager ARN containing Grafana administrator credentials
    Value: !Ref GrafanaAdminSecret