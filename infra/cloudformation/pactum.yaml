AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Pactum learning environment: VPC, public EKS worker subnets, private PostgreSQL RDS,
  generated database credentials in Secrets Manager, and a private S3 bucket.
  This template does not install an AWS Load Balancer Controller or grant application pods S3 access.

Parameters:
  ClusterName:
    Type: String
    Default: pactum-eks
    Description: EKS cluster name
    MinLength: 1
    MaxLength: 100
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'

  KubernetesVersion:
    Type: String
    Default: '1.33'
    Description: EKS Kubernetes version supported in this AWS region

  EksPublicAccessCidrs:
    Type: CommaDelimitedList
    Description: >
      CIDR blocks allowed to reach the public Kubernetes API endpoint.
      Set this to your public IP with /32; do not use 0.0.0.0/0 unless intentionally required.

  DbName:
    Type: String
    Default: pactum
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    MinLength: 1
    MaxLength: 63

  DbUsername:
    Type: String
    Default: pactumadmin
    AllowedPattern: '^[A-Za-z][A-Za-z0-9_]*$'
    MinLength: 1
    MaxLength: 63
    NoEcho: true

  DbInstanceClass:
    Type: String
    Default: db.t3.micro
    Description: RDS PostgreSQL instance class

  NodeInstanceTypes:
    Type: CommaDelimitedList
    Default: t3.medium
    Description: One or more EC2 instance types for the EKS managed node group

  DesiredNodes:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10

  MaxNodes:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 20

  ContractsBucketName:
    Type: String
    Description: Globally unique S3 bucket name for Pactum contract files
    MinLength: 3
    MaxLength: 63
    AllowedPattern: '^[a-z0-9][a-z0-9.-]*[a-z0-9]$'

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: Optional ACM certificate ARN; currently not used because no ALB/controller is installed

Conditions:
  HasAcmCertificate: !Not [!Equals [!Ref AcmCertificateArn, '']]

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-igw'

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-a'
        - Key: kubernetes.io/role/elb
          Value: '1'

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-public-b'
        - Key: kubernetes.io/role/elb
          Value: '1'

  PublicSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-a'

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-b'

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Pactum PostgreSQL
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-subnets'

  EKSClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Additional security group for the Pactum EKS cluster
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eks-cluster-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Permit PostgreSQL connections from within the Pactum VPC
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-db-sg'

  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eks-cluster-role'

  EKSNodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-eks-node-role'

  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Ref ClusterName
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PublicSubnetA
          - !Ref PublicSubnetB
          - !Ref DatabaseSubnetA
          - !Ref DatabaseSubnetB
        SecurityGroupIds:
          - !Ref EKSClusterSecurityGroup
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: !Ref EksPublicAccessCidrs
      Tags:
        - Key: Name
          Value: !Ref ClusterName
    DependsOn:
      - AttachInternetGateway
      - PublicSubnetARouteAssociation
      - PublicSubnetBRouteAssociation

  EKSNodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref EKSCluster
      NodegroupName: !Sub '${ClusterName}-nodes'
      NodeRole: !GetAtt EKSNodeRole.Arn
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      InstanceTypes: !Ref NodeInstanceTypes
      ScalingConfig:
        MinSize: 1
        DesiredSize: !Ref DesiredNodes
        MaxSize: !Ref MaxNodes
      CapacityType: ON_DEMAND
      Tags:
        Name: !Sub '${ClusterName}-nodes'
    DependsOn:
      - EKSCluster
      - PublicSubnetARouteAssociation
      - PublicSubnetBRouteAssociation

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${AWS::StackName}/database'
      Description: Generated credentials for Pactum PostgreSQL
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbUsername}"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-database-secret'

  PostgreSQLDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub '${AWS::StackName}-postgres'
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref DbUsername
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}::password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroup
      PubliclyAccessible: false
      BackupRetentionPeriod: 1
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-postgres'
    DependsOn:
      - DatabaseSecret
      - DatabaseSubnetGroup

  ContractsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ContractsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-contracts'

Outputs:
  ClusterName:
    Description: EKS cluster name
    Value: !Ref EKSCluster

  ClusterEndpoint:
    Description: Kubernetes API endpoint
    Value: !GetAtt EKSCluster.Endpoint

  VpcId:
    Description: VPC identifier
    Value: !Ref VPC

  DbSecretArn:
    Description: ARN of the Secrets Manager secret containing the database username and password
    Value: !Ref DatabaseSecret

  DbName:
    Description: PostgreSQL database name
    Value: !Ref DbName

  DbEndpoint:
    Description: PostgreSQL endpoint hostname
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Address

  DbPort:
    Description: PostgreSQL port
    Value: !GetAtt PostgreSQLDatabase.Endpoint.Port

  ContractsBucketName:
    Description: S3 bucket name
    Value: !Ref ContractsBucket
