apiVersion: apps/v1
kind: Deployment
metadata:
  name: pactum-frontend
  namespace: pactum
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app: pactum-frontend}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app: pactum-frontend}
    spec:
      containers:
        - name: nextjs
          image: FRONTEND_IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: '1', memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: {drop: [ALL]}
