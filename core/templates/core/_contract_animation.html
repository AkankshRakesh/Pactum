<div id="ca-viewport">
<div id="ca-stage">
  <div id="ca-camera">
    <div id="ca-startScreen">
      <button id="ca-makeBtn" type="button"><span>＋</span> Make contract</button>
    </div>

    <div id="ca-doc">
      <div id="ca-docTitle"></div>
      <div class="ca-divider"></div>
      <div id="ca-clause1" class="ca-clause"></div>
      <div id="ca-clause2" class="ca-clause"></div>
      <div id="ca-suggestionBox">
        <span id="ca-suggestionText"></span>
      </div>
      <div id="ca-clause3" class="ca-clause"></div>
      <div class="ca-divider" style="margin-top: 20px;"></div>
      <div id="ca-sigBlock">
        <div>
          <div class="ca-sigLabel">Signed by You</div>
          <div id="ca-sig1" class="ca-sigLine"></div>
        </div>
        <div>
          <div class="ca-sigLabel">Signed by Akanksh R.</div>
          <div id="ca-sig2" class="ca-sigLine"></div>
        </div>
      </div>
      <div id="ca-printRow">
        <button id="ca-printBtn" type="button">Seal contract</button>
      </div>
      <div id="ca-lockBadge">
        <span>✓ Contract sealed</span>
      </div>
    </div>

  </div>
</div>
</div>
